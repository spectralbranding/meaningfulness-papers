# ---------------------------------------------------------------------------
# External anchors -- deliberately EMPTY at lock. Phase 1 populates this, and
# no entry entering it may skip independent identifier verification.
# ---------------------------------------------------------------------------
external_anchors:
  - id: EA1
    anchor: >-
      A published collection of ten long-open results in mathematics and theoretical computer
      science, each accompanied by a machine-checkable formal certificate.
    use: >-
      The motivating distinction instantiated at scale by a third party. Every result is fully
      verified and none is thereby explained -- the certificate establishes correctness and
      supplies no account of why the construction works or which step carries the argument. This
      is the purest available real-world instance of the `verified_only` class, and it shows the
      gap the paper addresses widening from the production side rather than being hypothesised
      from the reader side.
    supports: [P2, P3]
  - id: EA2
    anchor: >-
      A single published document containing both the verbatim raw output of an automated system
      and a human-edited exposition of that same output, at roughly a fourfold difference in
      length.
    use: >-
      The VC3 specimen, and independently a demonstration of P2's divergence: prose mass grows by
      a factor of about 4.5 over what the document itself presents as the same construction. If
      the dependency structure is preserved across the pair, structural load is approximately
      unchanged while prose mass quadruples, which is the divergence measured on a real artifact
      rather than argued analytically.
    supports: [P2, P3]

