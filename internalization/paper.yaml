spec_version: 0.1.0
meta:
  title: 'Internalization as an Operation: Recovering the Dependency Structure of a Result, and a Pre-Registered
    Failure to Do So'
  authors:
  - name: Dmitry Zharnikov
    orcid: 0009-0000-6893-9231
    affiliation: Independent Researcher
  doi: 10.5281/zenodo.21828980
  date: '2026-08-07'
  venue: Preprint
  license: CC-BY-4.0
  keywords:
  - internalization
  - dependency structure
  - spine extraction
  - explanatory quality
  - argumentation mining
  - inter-annotator agreement
  - reader model
  - pre-registration.
  abstract: 'Machine systems now produce results faster than readers absorb them, and machine-generated
    summaries are widely observed to emphasize the wrong material. This paper argues the failure is structural,
    not one of model capability. Given only prose, a renderer can weight content by prose mass — the text
    an idea occupies — while the property it needs is structural load, defined over the dependency graph.
    The two diverge: a one-line lemma can carry an argument that pages of routine verification do not.
    The paper specifies a five-step internalization procedure, the inverse of structured drafting — prose
    to dependency graph to a second rendering — and supplies the measurement it requires: a miracle count,
    the number of steps verified but not derived from what a declared reader holds. Decision rules and
    agreement thresholds were fixed before any run. In the pre-registered validation, two machine operators
    from different model families extracted five documents; edge-level agreement fell below the declared
    threshold on every one, and the operators diverged on which nodes exist before how nodes connect.
    That extraction is well posed is refuted at that level, no downstream quantity is licensed, and the
    specification, the instrument, and the negative result are reported together.'
claims:
- id: P1
  type: proposition
  statement: 'Internalization is the inverse of structured drafting: where drafting maps a dependency
    graph to prose, internalization maps prose to a dependency graph and then to a second prose rendering
    addressed to a specific reader. The inverse is a specifiable procedure over the artifact''s structure,
    not a matter of authorial talent.'
  testable: true
  tested_in_paper: false
  status: not_tested
- id: P2
  type: proposition
  statement: A renderer given only rendered prose can weight content only by prose mass, while structural
    load is a property of the dependency graph. Because the two are not reliably correlated -- a single
    line can carry an argument that pages of routine verification do not -- the quality of a prose-only
    explanation is bounded by that correlation and does not improve with renderer capability alone. The
    failure is a missing input, not a missing ability.
  testable: true
  tested_in_paper: false
  status: not_tested
  depends_on:
  - P1
- id: P3
  type: proposition
  statement: 'Under a declared reader model and a fixed result, explanatory quality is measurable as a
    miracle count: the number of nodes that are verified but not derived from anything the reader holds.
    Internalization is the operation that lowers this count. It does not drive it to zero; a successful
    internalization localizes and names its residual rather than concealing it.'
  testable: true
  tested_in_paper: false
  status: not_tested
  depends_on:
  - P1
  - P2
- id: P4
  type: proposition
  statement: Comprehension admits an acceptance contract stated before the explanation is written and
    checked after it is read, with three clauses -- restate the dependency structure unaided, name the
    step the rest depends on and what fails without it, and execute one step the structure marks as open.
    The third clause has an objectively checkable outcome, which is what separates the contract from a
    satisfaction rating.
  testable: true
  tested_in_paper: false
  status: not_tested
  depends_on:
  - P1
  - P3
- id: P5
  type: proposition
  statement: The rendering a reader needs is determined by the difference between the artifact's ontology
    and the reader's held ontology, not by the artifact alone. Because that difference is computable from
    a compatibility classification, the instruction to define only what the reader lacks is an operation
    rather than an aphorism.
  testable: true
  tested_in_paper: false
  status: not_tested
  depends_on:
  - P1
methodology:
  type: theoretical
  design: 'Spine extraction: recover the typed dependency graph -- propositions, methods, evidence, assumptions,
    boundary conditions and their edges -- from a rendered artifact, using the drafting schema run in
    reverse. Ontology negotiation: classify every interaction between the extracted graph''s terms and
    the reader''s held terms into the six cross-owner classes, then read the unresolved classes as reader-facing
    lists -- an import neither side owns is a prerequisite; a shared key held with a different definition
    is a confusion. Load analysis: rank the extracted graph''s nodes by structural load using centrality
    over the dependency edges, pre-committing to one definition and reporting sensitivity across at least
    one alternative.'
acceptance:
- claim_id: P1
  criterion: 'Holds if internalization is the inverse of structured drafting: where drafting maps a dependency
    graph to prose, internalization maps prose to a dependency graph and then to a second prose rendering
    addressed to a specific reader.'
  falsification: If two competent operators running the stated procedure on the same artifact for the
    same declared reader produce dependency graphs whose agreement is at chance, the procedure does not
    specify an operation and P1 is false.
- claim_id: P2
  criterion: Holds if a renderer given only rendered prose can weight content only by prose mass, while
    structural load is a property of the dependency graph.
  falsification: If prose mass and graph-derived structural load are strongly correlated across a corpus
    of argumentative artifacts, the diagnosis is empty and P2 is false. The paper must measure this correlation
    rather than assert it.
- claim_id: P3
  criterion: 'Holds if under a declared reader model and a fixed result, explanatory quality is measurable
    as a miracle count: the number of nodes that are verified but not derived from anything the reader
    holds.'
  falsification: If, holding reader model and result fixed, independently scored miracle counts do not
    order a set of explanations consistently with expert judgments of explanatory quality on the same
    set, the count does not measure what it claims and P3 is false.
- claim_id: P4
  criterion: Holds if comprehension admits an acceptance contract stated before the explanation is written
    and checked after it is read, with three clauses -- restate the dependency structure unaided, name
    the step the rest depends on and what fails without it, and execute one step the structure marks as
    open.
  falsification: If readers who pass all three clauses are indistinguishable, on an independent expert
    assessment of understanding, from readers who fail the third, the contract does not discriminate and
    P4 is false.
- claim_id: P5
  criterion: Holds if the rendering a reader needs is determined by the difference between the artifact's
    ontology and the reader's held ontology, not by the artifact alone.
  falsification: If renderings built from the computed difference are not preferred, on comprehension
    outcomes, to renderings built from the artifact alone for the same readers, P5 is false.
