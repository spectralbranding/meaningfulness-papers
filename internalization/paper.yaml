limitations:
- description: Extraction, not rendering, is the expensive and brittle step. Human agreement on argument
    relations is low, and long-context retrieval degrades on material buried mid-document, which is where
    the lemmas and implicit assumptions an argument depends on sit. The pipeline's first stage is therefore
    its least reliable, and every downstream quantity inherits that error.
  severity: major
  addressable: true
- description: The extraction machinery was built for prose-proposition papers in management and marketing.
    A proof's dependency structure is finer-grained and more formal, and whether extraction stays faithful
    on mathematics is untested.
  severity: major
  addressable: true
- description: The miracle count is reader-relative by construction, so it measures an explanation-reader
    pair rather than an explanation. Cross-reader comparison is not licensed.
  severity: moderate
  addressable: true
- description: The acceptance contract is administered per reader, which bounds the generality of any
    single result and makes the third clause expensive to score at scale.
  severity: moderate
  addressable: true
- description: There is no within-operator baseline. Each document was extracted once per arm, and machine
    judges are unreliable against themselves across repeated runs, so the disagreement RC1 reports cannot
    be cleanly attributed to a difference between operators rather than to run-to-run variance. The design
    does not separate the two.
  severity: major
  addressable: true
- description: Two model families are an OPERATIONAL separation between operators, not a statistical one.
    Nothing guarantees that extractors from different families make uncorrelated errors, and where they
    share training material or inductive bias their errors correlate positively.
  severity: moderate
  addressable: true
