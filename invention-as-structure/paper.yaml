meta:
  title: 'Invention as a Structural Operation: Why the Abductive Jump Is a Re-Coordinatization of the
    Space of Description, Not a Sensory Leap'
  authors:
  - name: Dmitry Zharnikov
    orcid: 0009-0000-6893-9231
    affiliation: Independent Researcher
  doi: 10.5281/zenodo.21653102
  date: '2026-07-28'
  venue: Preprint
  license: CC-BY-4.0
  keywords:
  - scientific invention
  - abduction
  - representation change
  - symbol grounding
  - world models
  - evolvability
  - philosophy of AI
  abstract: 'A prevailing position holds that generative models have mastered induction and are conquering
    deduction but are structurally incapable of the abductive "jump" from sensory experience to new axioms,
    which is said to require embodied simulation and physically grounded world models. This paper argues
    that the jump is misdescribed. Invention is a typed structural operation on a representation — a change
    of the description itself — realized by four atomic moves: adjoining a dimension, rescaling or requantizing,
    re-topologizing, and gluing across domains. These moves are selected by a functional combining intrinsic
    structural signals (description length of the axioms, symmetry, and closure) with an often-weak empirical
    term that can act during generation rather than only downstream. Within representational systems whose
    compatibility predicate is decidable, the operator set is enumerable and the selection is computable,
    so the generative act is mechanizable, as a running artifact that performs and classifies cross-domain
    structural recombination demonstrates. The account is bounded: outside decidable domains the operator
    types describe the moves without an enumerability or completeness claim. Evolution — invention without
    a mind — runs on the same four moves, showing structural invention to be substrate- and cognition-independent.'
claims:
- id: SF1
  type: proposition
  statement: A prevailing position holds that generative AI has mastered induction (statistical pattern-fit)
    and is conquering deduction (formal proof) but is structurally incapable of the abductive "jump" from
    sensory experience to new axioms, which is said to require embodied simulation and physically grounded
    world models; the surrounding discourse frames such invention as the frontier test for general intelligence.
    Yet the same position concedes that in formal domains the substrate of study is the abstract landscape
    of formal systems, requiring no external world.
  testable: false
  tested_in_paper: false
  status: not_tested
- id: P1
  type: proposition
  statement: A representation is a typed structure over which a domain's regularities are stated; an invention
    is a morphism that changes the representation itself, not a datum obtained within a fixed representation.
    The unit of analysis is the representation-changing operation, not the observation.
  testable: false
  tested_in_paper: false
  status: not_tested
  depends_on:
  - SF1
- id: P2
  type: proposition
  statement: 'Invention''s atomic moves form a small set: (1) ADJOIN A DIMENSION — make a latent degree
    of freedom explicit; (2) RESCALE / REQUANTIZE — change the unit or granularity of measurement; (3)
    RE-TOPOLOGIZE / RE-SPECIFY — change connectivity or the admissible morphisms; (4) GLUE / PULL BACK
    ACROSS DOMAINS — identify a shared substructure of two representations and form their fibered combination.
    Falsifiable closure claim (scoped by C1): within a decidable-compatibility domain, an invention whose
    minimal description requires an operation outside this set refutes closure.'
  testable: false
  tested_in_paper: false
  status: not_tested
  depends_on:
  - P1
- id: P3
  type: proposition
  statement: 'The general-relativity move — promoting the measured coincidence of inertial and gravitational
    mass from a contingent numerical equality to a structural identity (a quotient / geometric re-topologization
    on the existing representation) — is a composition of re-topologize and adjoin-dimension moves, not
    a fresh percept. HOWEVER, the empirical constraint was active during generation: the correct curvature
    structure was found early and abandoned for roughly three years because it failed the Newtonian limit.
    Generation is therefore search under joint intrinsic and empirical constraints; the embodied "elevator"
    thought experiment is the human rendering of the structural move, not its content.'
  testable: false
  tested_in_paper: false
  status: not_tested
  depends_on:
  - P1
  - P2
- id: P4
  type: proposition
  statement: Move selection is governed by a functional combining intrinsic structural signals — minimum
    description length of the AXIOMS (not of the data), symmetry / invariance, and consistency / closure
    — with, when a substrate exists, an often-weak empirical adequacy term. Within any domain whose compatibility
    predicate is decidable, the operator algebra is enumerable and this functional is computable; outside
    such domains the paper makes no enumerability or completeness claim. This replaces both the pure-data-
    compression account and any appeal to unscoped heuristic search.
  testable: false
  tested_in_paper: false
  status: not_tested
  depends_on:
  - P2
  - P3
- id: P5
  type: proposition
  statement: 'Symbol grounding constrains knowing WHICH structural hypothesis is true of an external world,
    not the GENERATION of a well-typed structural hypothesis. But grounding is not wholly downstream:
    in empirical domains the "which move is domain-coherent" filter is exactly the weak empirical term
    of P4 and can co-select during generation; in formal domains it is absent and invention is fully intrinsic.
    This reconciles the symbol- grounding critique with mechanizability without positing a clean generate-then-validate
    pipeline.'
  testable: false
  tested_in_paper: false
  status: not_tested
  depends_on:
  - P3
  - P4
- id: P6
  type: proposition
  statement: Apparently novel primitives (imaginary numbers; entropy; the field concept) are structural
    completions under a consistency demand — a special case of adjoin-dimension in which an element is
    adjoined to make an operation total or to close a structure under a required law. Bounded to formalized
    systems, this dissolves the "creation ex nihilo" objection without claiming the space of completions
    is prestatable.
  testable: false
  tested_in_paper: false
  status: not_tested
  depends_on:
  - P2
- id: P7
  type: proposition
  statement: 'The corpus''s ontology-negotiation machinery performs AND classifies cross- domain structural
    recombination over typed specification modules (AGREEMENT / CONFLICT / CROSS_REFINE / CROSS_IMPORT
    / INCOMPATIBLE_REFINE), with a decidable compatibility predicate — a running artifact that mechanizes
    the glue, adjoin, and refine moves inside a specification domain. RESIDUAL EXPLANATORY GAIN: the four-move
    account predicts the classification of a given cross-owner module interaction and the admissibility
    of a proposed combination — a phenomenon that the embodied- abduction position (no account of formal-domain
    invention mechanics), pure recombination theories (no compatibility predicate, no running adjudicator),
    and data-compression accounts do not predict.'
  testable: false
  tested_in_paper: false
  status: not_tested
  depends_on:
  - P2
  - P4
- id: P8
  type: proposition
  statement: 'The market instance of the account: category creation is an adjoin- dimension move (a demand
    coordinate the market had no name for), and owning a category is adoption / lock-in of that coordinate
    — a meaning-side phenomenon — not a cognitive monopoly. This unifies the "invention wall" of the science
    discourse and the "category wall" of the strategy discourse as a single authoring-versus-optimizing
    distinction.'
  testable: false
  tested_in_paper: false
  status: not_tested
  depends_on:
  - P1
  - P2
- id: P9
  type: proposition
  statement: 'Evolution is invention without cognition, body, or intent, and it runs on the same four
    moves — the strongest existence proof that structural invention is substrate- AND mind-independent.
    Mapping: ADJOIN A DIMENSION = gene/genome duplication then neofunctionalization (a redundant copy
    is a new degree of freedom free to diverge); RESCALE / REQUANTIZE = polyploidy / whole-genome duplication
    and heterochrony (change of copy-number and of developmental timing/size); RE-TOPOLOGIZE / RE-SPECIFY
    = exaptation and regulatory rewiring (an existing structure''s admissible role is changed without
    changing the structure); GLUE / PULL BACK ACROSS DOMAINS = symbiogenesis / endosymbiosis (two independent
    lineages fused into one composite — the mitochondrion as a biological pullback). Selection is the
    JOINT functional of P4: fitness-in-environment is the empirical term and it is active DURING variation,
    not downstream — evolution is the paradigm case that "generation and validation are the same module"
    (supporting the P3 correction) — while developmental constraint / evolvability is the intrinsic term.
    Because the biological adjacent possible is not finitely prestatable, evolution operates OUTSIDE a
    decidable-compatibility domain (C1), which is exactly why its search is blind, slow, and wasteful
    rather than the fast computable selection of P4 — an honest illustration of L3, not a counterexample
    to it. RESIDUAL REACH: the four moves recur in a domain with no mind at all, which the embodied-abduction
    position (invention needs simulation), creativity-of-minds accounts (Boden/Fauconnier), and data-compression
    accounts neither predict nor explain. The corpus''s own fork / rebase / merge module operators are
    the computational cognates of duplication-divergence and symbiogenesis.'
  testable: false
  tested_in_paper: false
  status: not_tested
  depends_on:
  - P2
  - P3
  - P4
- id: C1
  type: proposition
  statement: BOUNDARY CONDITION. The mechanizability and closure claims (P2, P4, P6, P7) hold ONLY within
    representational systems whose compatibility predicate is decidable — formalized and specification
    domains. For open-ended empirical science, where the adjacent possible is not finitely prestatable,
    the account claims only that the four operator TYPES describe the observed moves; it does not assert
    the move-space is enumerable or the selection functional complete.
  testable: false
  tested_in_paper: false
  status: not_tested
  depends_on:
  - P4
  - P7
- id: A1
  type: proposition
  statement: RIVAL RULED OUT (embodiment necessity). The strongest embodied-cognition claim — that "dimension",
    "topology", and "gluing" are irreducibly sensorimotor — explains the human DISCOVERY rendering, not
    the substrate- independence of the FORMALIZED operation. Once formalized, the move is substrate-neutral,
    as demonstrated by intrinsic-selection discovery systems that use no body.
  testable: false
  tested_in_paper: false
  status: not_tested
  depends_on:
