# ---------------------------------------------------------------------------
# Findings -- what is the case. Added at the 1.0.0 fork.
# ---------------------------------------------------------------------------
findings:
  - id: F1
    statement: >-
      EDGE-LEVEL AGREEMENT FAILS THE .71 ABSOLUTE GATE IN ALL FIFTEEN CELLS, including the ten
      fixed-inventory cells where the units were supplied identically to both operators.
      Between-operator Layer 3 runs .000 to .367 under U-free, .227 to .488 under U-det and .000 to
      .481 under U-mod -- a maximum of .488 against a gate of .71, so no cell approaches it and none
      is a near miss. This is P4's pre-committed unfavourable branch, and it is the paper's headline
      result.

      THE WIDTH OF THE VERDICT IS PART OF THE FINDING, because Layer S failed (F3). What was
      supplied to both operators was a SHARED inventory, not a GOOD one, so what this run
      establishes is that SHARING an inventory does not rescue edge agreement, together with NF2's
      result that the failure is not an artifact of IMPOSING a cut. What it does NOT establish is
      any claim about a shared inventory of established fidelity: no inventory in this study cleared
      Layer S, so that cell is untested. The predecessor's recommendation is overturned in the form
      it was made -- fix the units the operators disagreed about -- and it is not thereby shown that
      units cannot matter under a better inventory. Claims are stated at that width in the abstract,
      the Results and the Discussion rather than at the wider one.
    source_measurements: [ME1]
    generating_method: M4a
    statistical_strength: >-
      Fifteen document-by-condition cells, each a mean over 25 cross-operator repetition pairs; every
      quantity document-level, aggregation across the five specimens descriptive only.
    conditions: "C1, C2, C3"
    body_sections: ["Results"]
    provenance: {created_by: "author", created_at: "2026-08-08"}
  - id: F2
    statement: >-
      THE BETWEEN-OPERATOR QUANTITY SEPARATES BELOW THE WITHIN-OPERATOR BASELINE IN ALL FIFTEEN
      CELLS, at p <= .001 with every percentile bootstrap interval on the difference excluding zero.
      Between-operator Layer 3 of .000 to .488 is read against a within-operator baseline of .625 to
      .873. The operators are far more consistent with themselves than with each other, so the
      disagreement is signal rather than run-to-run instability, and P2's falsifier -- which fires
      only when the interval includes zero on EVERY document -- does not fire.
    source_measurements: [ME1]
    generating_method: M3
    statistical_strength: >-
      Paired permutation null, 10,000 permutations, percentile bootstrap at B = 10,000, level .05 per
      document, streams seeded from the declared stable digest so each interval regenerates
      byte-identically from the committed record.
    conditions: "C2"
    body_sections: ["Results"]
    provenance: {created_by: "author", created_at: "2026-08-08"}
  - id: F3
    statement: >-
      LAYER S FAILS ON ALL FIVE DOCUMENTS -- .169, -.005, .250, .220 and .011 against a gate of .80 --
      so C4's second negative-scope condition is REALIZED rather than avoided: the imposed
      inventory's own error is large enough that measured agreement would describe the segmenter
      rather than the operators. VC3 R0 is the cleanest evidence, because there the two adjudicators
      agreed PERFECTLY with each other (kappa 1.000) and the segmenter still diverged from them
      (.250), which locates the failure in the segmenter rather than in the adjudication. The gate
      does not move.
    source_measurements: [ME2]
    generating_method: M1a
    statistical_strength: >-
      Five documents, one coefficient each, computed before any operator call.
    conditions: "C4"
    body_sections: ["Results"]
    provenance: {created_by: "author", created_at: "2026-08-08"}
  - id: F4
    statement: >-
      FOUR OF SIXTY-FOUR PRE-DECLARED GATE VERDICTS PASS -- 59 evaluable verdicts across the fifteen
      decomposition cells plus five Layer S verdicts. The four are VC3 R0 under U-mod at Layer 1
      (.737 against .51), VC3 R2 under U-mod at Layer 2 (.808 against .70), and VC3 R0's Layer 4
      ratio in BOTH fixed conditions (.856 under U-det and .989 under U-mod, against .70). All four
      fall on the two smallest documents and three of the four on VC3 R0, which is the smallest of
      the five and the one where both operators select nearly the whole inventory -- so they are read
      with suspicion rather than relief (F5).
    source_measurements: [ME1, ME2]
    generating_method: M4a
    statistical_strength: >-
      Verdict counts over the committed record; five verdicts are not evaluable (Layer 1, Layer 2 and
      the Layer 4 ratio are undefined in U-free, which has no shared inventory, and the Layer 4 ratio
      is undefined on VC3 R1 under U-mod where Layer 3 is .000).
    conditions: "C2"
    body_sections: ["Results"]
    provenance: {created_by: "author", created_at: "2026-08-08"}
  - id: F5
    statement: >-
      THE STUDY'S ONLY LAYER 1 PASS SITS IN A CELL WHOSE OBSERVED PREVALENCE INDEX IS .930, above the
      .85 interpretability floor. On VC3 R0 under U-mod both operators select nearly the whole
      inventory -- marginals .972 and .958 over 71 units, raw agreement .986 -- which is L4's
      manufactured-agreement risk realized in the one place the design returned a favourable
      selection verdict. The cell GATES as recorded, because the floor is declared on the PREDICTED
      index and that index was .108; the prediction is not revised in the light of the observation.
      The verdict therefore stands as computed and the observed index is reported beside it, so that
      no reader takes .737 for a selection result without the marginals that produced it. This is the
      only cell in the study whose observed index breaches .85. THE PAPER ALSO NAMES THE AMBIGUITY
      IT SITS ON: the deposited floor admits an observed-index reading as well as the predicted-index
      one the harness implements, and under that reading this coefficient is uninterpretable and the
      study carries three passing verdicts rather than four. Both readings are disclosed and neither
      is applied retroactively, because the reading that was implemented is also the one that
      flatters, and a rule re-applied after the results are visible is a degree of freedom whichever
      direction it moves.
    source_measurements: [ME1, ME3]
    generating_method: M4b
    statistical_strength: >-
      One cell; marginals, prevalence index, raw agreement and F-measure all reported, as M4b
      requires of every chance-corrected coefficient.
    conditions: "C4"
    antecedents: [F4]
    body_sections: ["Results"]
    provenance: {created_by: "author", created_at: "2026-08-08"}
  - id: F6
    statement: >-
      OBSERVED SELECTION DEPARTS SHARPLY FROM THE PREDICTED BASE RATE, AND IN OPPOSITE DIRECTIONS BY
      OPERATOR. OP_A selects above the prediction on every document and condition -- VC3 R0 predicted
      .446 against .905 observed under U-det and .972 under U-mod; VC1 predicted .143 against .421
      and .773 -- while OP_B selects far below it on the three long documents (.092, .027 and .038
      under U-det on VC1, VC2 and VC3 R1). The prediction was derived from the predecessor's POOLED
      node counts, and it describes neither operator. The floor still gates on the prediction exactly
      as declared, which is what makes it a pre-registration rather than an escape hatch; the gap
      between predicted and observed is reported as a finding in its own right rather than as a
      reason to re-gate.
    source_measurements: [ME1, ME3]
    generating_method: M4b
    statistical_strength: >-
      Ten fixed-inventory cells, marginals from the first repetition pair of each.
    conditions: "C2"
    body_sections: ["Results"]
    provenance: {created_by: "author", created_at: "2026-08-08"}
  - id: F7
    statement: >-
      THE COMPOSITE DIVERGES FROM THE DECOMPOSITION AND DOES NOT DOMINATE IT, which is M5a's declared
      test and it resolves in the decomposition's favour on the evidence rather than by assertion.
      The categorisation-focused companion crosses over against Layer 2 between conditions on the
      same document: on VC3 R0 it reads .467 against Layer 2's .659 under U-det, and .648 against
      .498 under U-mod. A statistic that reverses its ordering against another statistic between two
      conditions of the same document is not measuring the same thing, so the honest candidate
      distinction SURVIVES contact with the companion's definition and the decomposition's novelty
      does NOT narrow to the selection stage. The divergence is reported rather than resolved.
      EVIDENTIAL WEIGHT STATED: the reversal occurs in two of the ten fixed-inventory cells (VC3 R0
      under U-mod, VC1 under U-det); in the other eight Layer 2 reads higher than the companion, so
      the two mostly order consistently and differ in level. That defeats the DECLARED test, which
      was whether the two are INDISTINGUISHABLE IN PRACTICE -- statistics that reverse anywhere are
      not interchangeable -- so the pre-committed narrowing does not trigger. It is not the stronger
      claim that the two measure unrelated things, and the paper does not make it.
      Carried with the claim: the composite is computed on repetition 1 only while the layered form
      averages 25 cross pairs, and the deposit already declares these are not averages over the same
      thing.
    source_measurements: [ME4, ME1]
    generating_method: M5a
    statistical_strength: >-
      Fifteen cells in both members of the family; the composite is non-gating by declaration (M4),
      so no verdict rests on it.
    conditions: "C2"
    body_sections: ["Results"]
    provenance: {created_by: "author", created_at: "2026-08-08"}
  - id: F8
    statement: >-
      THE RE-ANALYSIS MOVES THE PREDECESSOR'S NODE LAYER DOWN BY .409 TO .765 wherever a reported
      comparator exists: .663 to .136 on VC1, .637 to .228 on VC2, 1.000 to .235 on VC3 R0 and .769
      to .245 on VC3 R2. VC3 R1 has no reported comparator in the predecessor's record and is
      reported as recomputed-only (.125). The direction declared before the recomputation therefore
      holds on four of five documents and is contradicted on none.
    source_measurements: [ME5]
    generating_method: M5
    statistical_strength: >-
      Five documents, one recomputation each; a re-analysis of a published record, reported as this
      paper's own and not as a revision of the predecessor's numbers.
    conditions: "C3"
    body_sections: ["What Round 1's node layer was worth"]
    provenance: {created_by: "author", created_at: "2026-08-08"}
  - id: F9
    statement: >-
      THE DISAGREEMENT IS DOMINATED, ON THE LONG DOCUMENTS, BY A GROSS ASYMMETRY IN HOW MUCH OF A
      DOCUMENT EACH OPERATOR TREATS AS NODE-WORTHY, AND FIXING THE INVENTORY DOES NOT REMOVE IT.
      OP_B returns roughly 14 to 16 nodes almost regardless of document length or inventory size --
      16 of 421 units on VC3 R1 under U-det, 15 of 406 under U-mod -- while OP_A returns 50 to 170.
      The alternative explanation was excluded before the number was read as a finding (RC1), and the
      asymmetry replicates the predecessor exactly on VC3 R1, at 14 nodes in both studies. Given 421
      units, OP_B still selects 16: that is P4's unfavourable branch in its starkest available form.
    source_measurements: [ME1]
    generating_method: M2
    statistical_strength: >-
      Descriptive across documents and conditions; the replication is a two-study comparison on one
      document, not an estimate.
    conditions: "C1, C2"
    antecedents: [RC1]
    body_sections: ["Results"]
    provenance: {created_by: "author", created_at: "2026-08-08"}
  - id: F10
    statement: >-
      M4b's PREVALENCE PARADOX ARRIVES EXACTLY WHERE THE DESIGN SAID TO LOOK FOR IT. On VC2's Layer
      S, raw agreement of .690 sits against a coefficient of -.005, because both parties mark about
      eighty percent of candidate positions as boundaries -- marginals .791 and .829 -- so expected
      agreement is .691 and the observed agreement is a hair below it. The coefficient is behaving
      correctly under the observed-marginal chance model that M4b KEPT rather than replaced; the
      marginals are the report. This is the case the design declined to engineer away with a
      prevalence-robust substitute, and it vindicates that refusal rather than embarrassing it.
    source_measurements: [ME2]
    generating_method: M4b
    statistical_strength: >-
      One document, one layer; reported with marginals, expected agreement and raw agreement as M4b
      requires.
    conditions: "C4"
    body_sections: ["Results"]
    provenance: {created_by: "author", created_at: "2026-08-08"}

# ---------------------------------------------------------------------------
# Negative findings -- discoveries of absence. Added at the 1.0.0 fork.
# ---------------------------------------------------------------------------
negative_findings:
  - id: NF1
    statement: >-
      NO CONDITION PRODUCES A FAVOURABLE EDGE-LEVEL BRANCH ANYWHERE. U-free, U-det and U-mod all fail
      Layer 3's absolute gate on all five documents, and all three fail it by a wide margin. The
      free-unitization arm therefore reproduces the fixed-inventory arms' failure rather than
      diverging from it.
    expected_observation: >-
      A fixed-inventory condition clearing .71 on at least one document where U-free does not, which
      would have shown the intervention moving the quantity it was built to move.
    source_method: "M1, M4a"
    affects_nodes: [P1, P4, L6]
    motivates: [F1]
    body_sections: ["Results", "The objection that the task has been replaced rather than decomposed"]
    provenance: {created_by: "author", created_at: "2026-08-08"}
  - id: NF2
    statement: >-
      THE GRANULARITY-MISMATCH THREAT IS NOT WHAT PRODUCED THE FAILURE, on the control the design
      declared for it. L6's mitigation was stated in advance as: if U-det fails and U-free fails in
      the same way, the segmentation did not produce the failure. Both fail, in the same way, on
      every document -- so the imposed cut is not the explanation for the edge-level result, and the
      substitution objection to P1 does not bite either. What this does NOT do is exonerate the
      segmenter, whose own fidelity failed on all five documents (F3); it establishes only that the
      edge failure is not an artifact of imposing units, because it is equally present where no units
      were imposed.
    expected_observation: >-
      U-det failing where U-free succeeds, which would have indicated an edge-drawing deficit
      manufactured by the imposed granularity.
    source_method: "M1, M1a"
    affects_nodes: [L6, P1]
    motivates: [F1]
    body_sections: ["Results"]
    provenance: {created_by: "author", created_at: "2026-08-08"}

# ---------------------------------------------------------------------------
# Robustness checks -- alternatives excluded before a number was read as a
# finding. Added at the 1.0.0 fork.
# ---------------------------------------------------------------------------
robustness_checks:
  - id: RC1
    statement: >-
      TRUNCATION EXCLUDED AS THE EXPLANATION FOR OP_B's SMALL GRAPHS. A recurring node count is
      exactly what a truncated response looks like, and the design's own prompt says a graph that
      stops early is wrong, so the possibility was checked rather than assumed away. Every such call
      returned a normal stop reason rather than a length stop, used about 1,751 output tokens against
      a cap of 96,000, parsed completely, and passed the schema validators. OP_B is answering fully
      and briefly.
    mitigates: []
    affects_nodes: [F9]
    body_sections: ["Results"]
    provenance: {created_by: "author", created_at: "2026-08-08"}
  - id: RC2
    statement: >-
      THE COMPOSITE IS SEEDED AND REPRODUCIBLE, AND THE SOLVER IS NOT A DEGREE OF FREEDOM. The
      coefficient's expected disorder is Monte-Carlo estimated and the implementation does not seed
      that sampler; unseeded, one cell returned .589, .593, .594 and .597 across four runs of
      identical input. The sampler is now seeded from the same stable-digest construction the
      separation test uses, which APPLIES the study's declared reproducibility rule rather than
      amending it, and two full passes over all fifteen cells now agree to six decimal places. The
      alignment is an exact mixed-integer program solved at a proven 0.0 percent gap, so an
      alternative solver returns the same objective. Neither can move a verdict, because the
      composite is declared non-gating.
    mitigates: []
    affects_nodes: [F7, ME4]
    body_sections: ["Results"]
    provenance: {created_by: "author", created_at: "2026-08-08"}

# ---------------------------------------------------------------------------
# Limitations, carried forward and new
# ---------------------------------------------------------------------------
limitations:
  - id: L1
    statement: >-
      N is still five documents, and the specimen corpus is deliberately unchanged. No
      generalization claim is available.
    affects: [P4]
    severity: "high"
    mitigation: "Claim a controlled contrast, not a general result. Inherited from Round 1 and not repaired."
    provenance: {created_by: "author", created_at: "2026-08-07"}
  - id: L2
    statement: >-
      The training-data contamination threat on the philosophical specimen is unchanged. It inflates
      a positive result specifically and cannot be removed by blinding.
    affects: [P4]
    severity: "medium"
    mitigation: "Carried forward verbatim from Round 1 and reported as a bound on the claim."
    provenance: {created_by: "author", created_at: "2026-08-07"}
  - id: L3
    statement: >-
      The unitizer is a new researcher degree of freedom. A segmenter imported across domains
      carries its own error, and this design must not launder that error into the operators' scores.
    affects: [P1, P4]
    severity: "high"
    mitigation: >-
      Both conditions declared in advance with the primary fixed; the unitizer's output published
      with the record so a reader can inspect what the operators were given.
    provenance: {created_by: "author", created_at: "2026-08-07"}
  - id: L4
    statement: >-
      Fixing the units may manufacture agreement rather than measure it. If node selection is
      near-universal over sentence-like units, the coefficient is high by construction. This is the
      mirror image of Round 1's error -- Round 1 conditioned disagreement away, this design could
      define it away.
    affects: [P1]
    severity: "high"
    mitigation: >-
      A base-rate-aware chance model and a declared floor, both fixed before the run. Named as the
      single most likely way this paper fools itself.
    provenance: {created_by: "author", created_at: "2026-08-07"}
  - id: L5
    statement: >-
      DISCHARGED 2026-08-07. The sequencing constraint was real and is now satisfied: the paper
      cites its predecessor, could not be deposited before it, and the predecessor was deposited on
      2026-08-07 under a resolving concept DOI. The predecessor is therefore cited as a
      deposited record rather than as a working paper, and this paper is no longer blocked behind
      it. The limitation is retained rather than deleted because the ORDERING still holds for every
      later round of the arc, and because a reader should be able to see that the constraint was
      declared before it was met rather than after.
    affects: []
    severity: "discharged"
    mitigation: "Stated as a hard ordering rather than managed; the ordering was met, not waived."
    provenance: {created_by: "author", created_at: "2026-08-07"}
  - id: L6
    statement: >-
      GRANULARITY MISMATCH. Fixing the units does not eliminate the unitization problem so much as
      trade it. If the imposed rule cuts at a granularity that conflicts with an operator's internal
      representation of the argument, the operator will fail to draw edges, and the failure will be
      recorded as an edge-drawing deficit when it is an artifact of the segmentation. This is worse
      than the prevalence risk because it produces a result that looks exactly like the one the
      paper is testing for. Displayed mathematics is where it bites hardest.
    affects: [P1, P4]
    severity: "high"
    mitigation: >-
      The U-free arm is the control: if U-det fails and U-free fails in the same way, the
      segmentation did not produce the failure. Plus M1a -- a version-pinned segmenter with a stated
      reliability and a declared rule for mathematical units.
    provenance: {created_by: "author", created_at: "2026-08-07"}
  - id: L7
    statement: >-
      The within-operator baseline includes provider-side variance that is not a property of the
      model -- dynamic batching makes temperature-zero decoding nondeterministic, so part of the
      measured variance tracks infrastructure conditions at call time.
    affects: [P2]
    severity: "medium"
    mitigation: >-
      Addressed by DEFINITION rather than by repair: the quantity is reproducibility of the
      instrument as deployed, which is what a replicator faces and which properly includes that
      variance. A local fixed-batch control arm would isolate the model's own contribution but would
      change the operator class from hosted frontier models to open-weight local ones, so it is
      recorded as an explicit scope decision rather than assumed in.
    provenance: {created_by: "author", created_at: "2026-08-07"}

  - id: LA1
    statement: >-
      THE LAYER S ADJUDICATORS ARE MACHINE, NOT HUMAN. The deposit's M1a describes two adjudicators
      segmenting independently under the declared rule with a third resolving, and M4a derives the
      .80 gate as a discount on the human blind segmentation floor because rule-against-HUMAN
      adjudication is the harder comparison. What ran is that same structure -- two independent
      adjudicators from families used in no other role, blind to the hypotheses and to which
      condition the inventory would serve, plus a third-family resolver -- with machine adjudicators
      in place of human ones. The alternative to the substitution was no Layer S at all, and
      therefore no operator call, since the ordering is itself pre-registered.
    affects: [F3, ME2]
    severity: "high"
    mitigation: >-
      The threshold is NOT adjusted in either direction, because the direction of the effect is
      unknown: machine adjudicators may be more rule-following than humans, which would make the
      comparison easier, or may share the segmenter's failure modes, which would inflate agreement
      for a reason unrelated to the segmenter being right. Adjusting would require a number that does
      not exist -- the same move the design refuses for the Layer 3 document-scale discount. Layer S
      is reported as machine-adjudicated fidelity and every claim resting on it is read at that
      width. Declared before any call of any kind.
    provenance: {created_by: "author", created_at: "2026-08-08"}
  - id: LA2
    statement: >-
      LAYER S ADJUDICATION IS ELICITED IN CHUNKS OF 25 CANDIDATE POSITIONS rather than one call per
      document, each chunk carrying its own passage with a 240-character overlap into the preceding
      chunk. Every candidate is still decided exactly once, under the same rule, by the same
      adjudicator. A whole-document call did not survive contact with the providers: one adjudicator
      spent its entire token budget reasoning and returned empty content, and another answered a
      614-candidate document with 64 boundaries.
    affects: [F3, ME2]
    severity: "medium"
    mitigation: >-
      Stated rather than absorbed: a chunked adjudicator sees less context than a whole-document one,
      and a boundary judgement near a chunk edge is made against the preceding chunk's tail rather
      than the whole preceding argument. The overlap bounds this without removing it, the direction
      is unknown, and the gate is not adjusted. Introduced in the harness as first written, before
      any adjudication quantity was observed.
    provenance: {created_by: "author", created_at: "2026-08-08"}
  - id: LA3
    statement: >-
      AN UNPARSEABLE ADJUDICATION CHUNK IS RECORDED UNANSWERED AND THE PASS CONTINUES, a failure mode
      the deposited design did not anticipate. For positions inside an unanswered chunk the design's
      two independent adjudicators reduce to one adjudicator plus the resolver -- the resolver still
      decides them, because a position one adjudicator marked and the other did not is by definition
      disputed. Introduced before any Layer S coefficient was computed.
    affects: [F3, ME2, ME6]
    severity: "medium"
    mitigation: >-
      The degradation is MEASURED rather than described (ME6): 125 of 2,256 positions, 5.5 percent,
      decided by one adjudicator plus the resolver. It is not uniform, and it bears on one reported
      quantity in particular -- VC3 R1 carries both the largest singly-adjudicated share (13.3
      percent) and the lowest inter-adjudicator agreement (.631), and the two are not independent,
      since an unanswered chunk depresses one adjudicator's boundary count in a region where
      boundaries exist. The inter-adjudicator figure for VC3 R1 is therefore reported as a FLOOR
      rather than an estimate, and the same holds more weakly for VC2. The Layer S coefficient itself
      is less affected, because the resolver restores the disputed positions before it is computed.
    provenance: {created_by: "author", created_at: "2026-08-08"}
  - id: LA4
    statement: >-
      THE TWO OPERATORS ARE NOT SAMPLED THE SAME WAY, AND CANNOT BE. M3 requires the k repetitions to
      run "under identical parameters", and they are identical WITHIN each operator, which is what
      the within-operator baseline requires. They are not identical BETWEEN operators, because this
      provider pair offers no common setting: OP_B is called at temperature 0 with the study seed,
      while OP_A's family rejects sampling parameters outright and bounds reasoning depth by an
      effort level instead. Equalising would have meant abandoning the predecessor's operator pair,
      and comparability with the run whose failure this design decomposes is the reason that pair is
      used at all.
    affects: [F2, P2, ME1]
    severity: "high"
    mitigation: >-
      Nothing is done to the declared statistic: the pooled within-operator mean is computed exactly
      as M3 specifies and is not adjusted. What is added is REPORTING, in the spirit of M4b's
      requirement that a summary never travel without its marginals -- each operator's own baseline
      is emitted beside every pooled figure, with a flag that says outright when an operator
      contributed a constant. The consequence must travel with F2: a deterministic operator has no
      run-to-run variance, so its within-operator agreement is 1.000 by construction rather than by
      measurement, the pooled baseline is inflated wherever that happens, and an inflated baseline
      makes P2's separation EASIER to obtain -- biasing the design against its own falsifier firing.
      The measured gap is far too large for that inflation to account for, but the caveat is stated
      wherever the separation is claimed. Configuration fixed before any call; consequence discovered
      during the run and reported rather than repaired.
    provenance: {created_by: "author", created_at: "2026-08-08"}

