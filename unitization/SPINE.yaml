corpus_precedents:
  - paper_key: 2026bk
    relationship: extends
    claim: >-
      Round 1 specifies the internalization operation, freezes the extraction guidelines, declares
      the decision rule, and reports the run that failed at its gate and located the failure
      upstream of relation labelling. This paper inherits all of it and tests the location.
  - paper_key: 2026ao
    relationship: inherits
    claim: >-
      The cost-asymmetry account of structural versus rendered layers, which Round 1 inherits and
      does not re-litigate. That framework also licenses its preservation result on an axiom of
      extraction faithfulness whose falsifier is inter-coder agreement on retroactive extractions,
      and that axiom is asserted there rather than measured — so this run bears on it. Forward
      reference only: the connection is stated, nothing here is re-derived for it, and the
      non-equivalence is carried with it.

  - paper_key: 2026ap
    relationship: bears_on_assumption
    claim: >-
      The empirical companion applies that axiom to twin-pair results obtained by reference-free
      retroactive extraction — the same operation this paper measures. This run supplies no test of
      its coefficient or threshold and uses different specimens and machine rather than human
      operators, so it does not settle the axiom there; what it removes is the expectation that a
      better protocol absorbs the disagreement.

