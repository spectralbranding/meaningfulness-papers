  severity: major
  addressable: true
- description: 'DISCHARGED 2026-08-07. The sequencing constraint was real and is now satisfied: the paper
    cites its predecessor, could not be deposited before it, and the predecessor was deposited on 2026-08-07
    under a resolving concept DOI. The predecessor is therefore cited as a deposited record rather than
    as a working paper, and this paper is no longer blocked behind it. The limitation is retained rather
    than deleted because the ORDERING still holds for every later round of the arc, and because a reader
    should be able to see that the constraint was declared before it was met rather than after.'
  severity: moderate
  addressable: true
- description: GRANULARITY MISMATCH. Fixing the units does not eliminate the unitization problem so much
    as trade it. If the imposed rule cuts at a granularity that conflicts with an operator's internal
    representation of the argument, the operator will fail to draw edges, and the failure will be recorded
    as an edge-drawing deficit when it is an artifact of the segmentation. This is worse than the prevalence
    risk because it produces a result that looks exactly like the one the paper is testing for. Displayed
    mathematics is where it bites hardest.
  severity: major
  addressable: true
- description: The within-operator baseline includes provider-side variance that is not a property of
    the model -- dynamic batching makes temperature-zero decoding nondeterministic, so part of the measured
    variance tracks infrastructure conditions at call time.
  severity: moderate
  addressable: true
- description: THE LAYER S ADJUDICATORS ARE MACHINE, NOT HUMAN. The deposit's M1a describes two adjudicators
    segmenting independently under the declared rule with a third resolving, and M4a derives the .80 gate
    as a discount on the human blind segmentation floor because rule-against-HUMAN adjudication is the
    harder comparison. What ran is that same structure -- two independent adjudicators from families used
    in no other role, blind to the hypotheses and to which condition the inventory would serve, plus a
    third-family resolver -- with machine adjudicators in place of human ones. The alternative to the
    substitution was no Layer S at all, and therefore no operator call, since the ordering is itself pre-registered.
  severity: major
  addressable: true
- description: 'LAYER S ADJUDICATION IS ELICITED IN CHUNKS OF 25 CANDIDATE POSITIONS rather than one call
    per document, each chunk carrying its own passage with a 240-character overlap into the preceding
    chunk. Every candidate is still decided exactly once, under the same rule, by the same adjudicator.
    A whole-document call did not survive contact with the providers: one adjudicator spent its entire
    token budget reasoning and returned empty content, and another answered a 614-candidate document with
    64 boundaries.'
  severity: moderate
  addressable: true
- description: AN UNPARSEABLE ADJUDICATION CHUNK IS RECORDED UNANSWERED AND THE PASS CONTINUES, a failure
    mode the deposited design did not anticipate. For positions inside an unanswered chunk the design's
    two independent adjudicators reduce to one adjudicator plus the resolver -- the resolver still decides
    them, because a position one adjudicator marked and the other did not is by definition disputed. Introduced
    before any Layer S coefficient was computed.
  severity: moderate
  addressable: true
- description: 'THE TWO OPERATORS ARE NOT SAMPLED THE SAME WAY, AND CANNOT BE. M3 requires the k repetitions
    to run "under identical parameters", and they are identical WITHIN each operator, which is what the
    within-operator baseline requires. They are not identical BETWEEN operators, because this provider
    pair offers no common setting: OP_B is called at temperature 0 with the study seed, while OP_A''s
    family rejects sampling parameters outright and bounds reasoning depth by an effort level instead.
    Equalising would have meant abandoning the predecessor''s operator pair, and comparability with the
    run whose failure this design decomposes is the reason that pair is used at all.'
  severity: major
  addressable: true
