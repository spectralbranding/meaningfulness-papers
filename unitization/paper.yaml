spec_version: 0.1.0
meta:
  title: 'Unitization Before Extraction: A Pre-Registered Decomposition of Disagreement in Machine Recovery
    of Dependency Structure'
  authors:
  - name: Dmitry Zharnikov
    orcid: 0009-0000-6893-9231
    affiliation: Independent Researcher
  doi: 10.5281/zenodo.21830220
  date: '2026-08-12'
  venue: Preprint
  license: CC-BY-4.0
  keywords:
  - unitization
  - inter-annotator agreement
  - diagnostic replication
  - dependency structure
  - machine annotation
  - reproducibility
  - pre-registration
  - argument mining.
  abstract: 'Machine-extracted argument structures are increasingly read as evidence about how fields
    move, so measurement error at extraction propagates into whatever is built on the extracted graph.
    A prior pre-registered run found two machine operators did not recover the dependency structure of
    five argumentative documents at a declared agreement level, and located the failure upstream of relation
    labelling, but could not say what the disagreement was made of. This paper fixed the unit inventory
    before extraction, supplied it identically to both operators, and repeated every extraction five times,
    decomposing disagreement into selection, typing and relation drawing against a within-operator baseline.
    Every threshold was derived from its own reference class and deposited before data collection. Across
    150 extraction calls in three unitization conditions, edge-level agreement failed its $.71$ gate in
    all fifteen document-by-condition cells, including the ten where units were supplied identically,
    and separated below the within-operator baseline in every cell ($p \leq .001$). On this corpus the
    predecessor''s closing recommendation is therefore overturned: sharing an inventory does not rescue
    edge agreement, so unitization was not where the failure lived. Segmenter fidelity failed on all five
    documents, which bounds every fixed-inventory claim here and leaves a shared inventory of established
    fidelity untested.'
