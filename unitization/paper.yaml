methodology:
  type: empirical
  design: 'THREE conditions, ordered in advance, all on the same five documents with the same operator
    pair in the same epoch. U-free, no inventory supplied, the free-unitization condition, which is both
    the comparability control and the control for granularity mismatch. U-det, a deterministic published
    segmentation rule applied with no model in the loop, the PRIMARY intervention. U-mod, units produced
    by a model family used neither as operator nor as rater, the realistic deployment condition. The ordering
    is fixed here so that a result cannot later be reported from whichever condition ran the better way.
    Running U-free in-study rather than relying on the predecessor''s numbers is what makes the contrast
    sound: fixed-index classification and free unitizing occupy different probability spaces, so a cross-study
    magnitude comparison would not have been valid. VALIDATE THE SEGMENTER BEFORE USING IT. A segmenter
    whose own reliability is unknown cannot serve as a control condition, because its error passes silently
    to the operators and is scored as theirs. The deterministic rule is fixed by version, its own reported
    reliability is stated, and its treatment of DISPLAYED MATHEMATICS is declared before the run as an
    explicit rule rather than handled case by case -- a rule that splits on sentence punctuation shatters
    displayed equations into fragments, and one of the five specimens is a mathematical exposition. ADDED
    at Phase 3: a segmenter''s reported accuracy is measured on ITS OWN benchmarks, and a rule that scores
    well on newswire need not on a mathematical exposition or a philosophical essay. Its agreement with
    a hand-adjudicated inventory ON THESE FIVE DOCUMENTS is therefore established BEFORE any operator
    call and reported per document beside the operator quantities. The ORDER is the substantive part:
    measured after the operator runs, the segmenter''s error becomes available as an explanation for whatever
    the operators did, which is precisely the researcher degree of freedom L3 names. THE ADJUDICATED INVENTORY
    IS ITSELF AN INSTRUMENT and is produced as one: two adjudicators segment each document independently
    under the declared rule, blind to the study''s hypotheses and to which condition the inventory will
    serve; a third resolves disagreements; and the adjudicators'' own agreement is reported beside the
    segmenter''s. Without that, the segmenter-fidelity layer compares the instrument against its own designer
    and the degree of freedom L3 closes reopens one level up. THE DETERMINISTIC RULE IS SENTENCE SEGMENTATION
    AT A PINNED VERSION, and the coarser granularity is declared rather than hidden. U-det uses a rule-based
    sentence segmenter that is installable at a fixed release, carries a permissive licence and reports
    its own accuracy against a published rule set. Two finer elementary-discourse-unit rules exist and
    neither is adopted, for reasons stated in the pre-registration rather than left implicit. The first
    defines units on clause boundaries and reports the highest blind segmentation reliability available
    for any rule, but its gold corpus is licensed and using the rule would mean reimplementing it and
    having no evidence that the reimplementation is faithful. The second is distributed only as a single
    archive with no release tags, requires an interpreter and library generation two decades old, and
    bundles a third-party script carrying no licence, so it cannot be published as reproduction code.
    The two rules also disagree with each other -- one deliberately does not treat complements of attributive
    verbs as units -- so there is no single "the" discourse rule to inherit. The consequence is stated
    as a limitation and not as a finding: sentence units are coarser than discourse units, so U-det tests
    a coarser shared inventory than the finest one available, and the granularity-mismatch threat is argued
    at that granularity. THE SHARPEST REPLY IS ACCEPTED RATHER THAN DEFLECTED: that this design has not
    removed a segmentation-AGREEMENT problem so much as converted it into a segmentation-CHOICE problem,
    and that choosing sentence over discourse granularity is itself the study''s most consequential decision
    rather than a preliminary. That is why the choice is argued on stated grounds, why a second model-produced
    inventory runs rather than leaving one rule unexamined, and why the effect of granularity is reported
    per document rather than assumed uniform. The design does not settle which granularity is correct;
    it fixes one, declares it, and measures what follows. THE AFFIRMATIVE CASE for imposing a rule at
    all is established rather than assumed: human subjects segment discourse reliably once a criterion
    is declared, which makes a declared criterion an improvement on unconstrained judgement rather than
    a straitjacket.'
acceptance:
- claim_id: P1
  criterion: Holds if disagreement in machine recovery of document-scale dependency structure decomposes
    into three separately measurable components -- unitization, node selection and typing over a fixed
    unit inventory, and relation drawing over a shared node set -- and fixing the first by design is what
    makes the second and third measurable at all.
  falsification: If agreement over a fixed unit inventory cannot be computed without conditioning on a
    matched subset -- that is, if the same conditioning Round 1 was criticised for reappears once units
    are fixed -- the decomposition is not achieved and P1 is false.
- claim_id: P2
  criterion: Holds if a between-operator agreement number is uninterpretable without a within-operator
    baseline.
  falsification: 'BROADENED at Phase 3, because the original form was too narrow to fire. P2 is false
    if the within-operator baseline is uninformative -- which now covers two cases rather than one. The
    first is the original: within-operator agreement at or near ceiling on every document. The second,
    and the one that will actually occur, is within-operator agreement STATISTICALLY INDISTINGUISHABLE
    FROM BETWEEN-OPERATOR AGREEMENT on every document, since a floor that does not separate from the quantity
    it is supposed to calibrate cannot calibrate it. THE TEST IS FIXED HERE, so that the falsifier can
    fire mechanically: per document, the difference between the within-operator and the between-operator
    coefficient is referred to a PAIRED PERMUTATION NULL under which the within-pair and between-pair
    labellings of the repeated extractions are exchangeable, with 10,000 permutations and a percentile
    bootstrap interval on the difference at B = 10,000. The stream is offset by a stable digest of the
    document identifier rather than by a process-dependent hash, so the draw regenerates byte-identically
    from the committed record. The level is .05 per document, and the falsifier fires only when the interval
    includes zero on EVERY document; a mixed outcome is reported per document and does not fire it. Either
    way the design would have spent its repetitions to learn nothing, which is a result about this class
    of operator and is reported as one.'
- claim_id: P3
  criterion: Holds if round 1's node-layer statistic is favourably biased by conditioning on matched nodes,
    and the size of the bias is measurable by recomputing that layer under a coefficient that charges
    for boundary disagreement rather than excluding it.
  falsification: 'If the recomputation leaves Round 1''s node layer materially unchanged, the conditioning
    was not doing the work attributed to it and P3 is false. The direction is declared BEFORE the recomputation:
    the expectation is that Round 1''s node layer looks worse, and the result is reported whichever way
    it comes out.'
- claim_id: P4
  criterion: Holds if the located failure is testable and may be refuted.
  falsification: 'P4 is the falsification instrument rather than a claim to defend: it is stated so that
    the unfavourable branch is pre-committed. Reporting an inconclusive run instead of this branch is
    the specific failure mode the pre-declaration exists to prevent.'
