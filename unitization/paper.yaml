  type: proposition
  statement: Disagreement in machine recovery of document-scale dependency structure decomposes into three
    separately measurable components -- unitization, node selection and typing over a fixed unit inventory,
    and relation drawing over a shared node set -- and fixing the first by design is what makes the second
    and third measurable at all.
  testable: true
  tested_in_paper: true
  status: not_tested
- id: P2
  type: proposition
  statement: 'A between-operator agreement number is uninterpretable without a within-operator baseline.
    Machine operators are unreliable against themselves across repeated runs, so low between-operator
    agreement may be variance rather than disagreement, and high agreement may be a shared prior rather
    than a recovered structure. The baseline measures REPRODUCIBILITY OF THE INSTRUMENT AS DEPLOYED, not
    the model''s epistemic uncertainty: provider-side variance is a genuine component of what a replicator
    faces and is therefore part of the quantity, not a contaminant of it.'
